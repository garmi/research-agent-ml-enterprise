# Strength Verbs Hierarchy for Sentence-Level Claims
# Sentences cannot use verbs stronger than the weakest cited claim's grade.

levels:
  strong:
    rank: 5
    verbs:
      - "shows"
      - "demonstrates"
      - "finds"
      - "proves"
      - "establishes"
      - "confirms"
      - "reveals"
      - "measured"

  moderate:
    rank: 4
    verbs:
      - "suggests"
      - "indicates"
      - "points to"
      - "observes"
      - "evidences"
      - "reflects"
      - "correlates"

  weak:
    rank: 3
    verbs:
      - "reports"
      - "proposes"
      - "one study claims"
      - "hypothesizes"
      - "argues"
      - "posits"
      - "describes"
      - "asserts"

  vendor_claim:
    rank: 2
    verbs:
      - "states"
      - "claims"
      - "asserts"
      - "announces"
      - "promotes"
      - "according to"

  anecdote:
    rank: 1
    verbs:
      - "in one case"
      - "anecdotally"
      - "in an observed instance"
      - "practitioners report"
      - "informally noted"

# S14: intensifiers overstate unless the cited source itself says so. G4 fails a sentence that uses one
# when none of its cited quotes uses the same word stem (e.g. "significantly" needs "significant").
intensifiers:
  - "significantly"
  - "substantially"
  - "dramatically"
  - "drastically"
  - "greatly"
  - "vastly"
  - "massively"
  - "profoundly"
  - "radically"
  - "markedly"
  - "considerably"
  - "enormously"
  - "exponentially"
  - "remarkably"

# S16: a sentence that states a figure and cites only one source must say it rests on one study.
# G4 fails it unless it contains one of these phrases (case-insensitive).
single_source_phrases:
  - "one study"
  - "a single study"
  - "one paper"
  - "a single paper"
  - "one preprint"
  - "a single preprint"
  - "one survey"
  - "one report"
  - "one evaluation"
  - "one experiment"
  - "its authors report"
