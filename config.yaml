project:
  name: research-agent-ml-enterprise
  environment: mac

research:
  # S13: technology terms that name a question's subject. Search queries always keep them, and each
  # sub-question query gets the main question's, so every query searches the same subject.
  # S14: relevance is multiplied by these when ranking harvested papers, so verified venues lead
  # among equally relevant papers.
  venue_tier_weights:
    verified: 1.0
    reputable_preprint: 0.9
    unverified: 0.6
    vendor: 0.5
  query_anchor_terms:
    - ai
    - genai
    - llm
    - ml
    - code generation
    - code
    - coding
    - software
    - agent
    - agents
    - agentic
    - copilot
    - assistant
    - assistants
    - devops
    - devsecops
  default_topic: "AI adoption in enterprise software delivery"
  # S15: per depth, how many ranked candidates Check A judges, and how many on-topic papers are kept.
  depth:
    fast:
      candidates: 12
      keep: 5
    deep:
      candidates: 30
      keep: 15
  min_relevance_score: 0.5
  time_window: "2019-2025"
  min_year: 2020
  vendor_only_max_outcome: 2
  generic_research_words:
    - productivity
    - adoption
    - gains
    - evidence
    - teams
    - impact
    - empirical
    - study
    - analysis
    - evaluation
    - practice
    - digital
    - technology
    - research
    - engineering
    - delivery
    - trade-offs
    - tradeoffs
    - model
    - models
    - assessment
    - implications
    - guidance
    - perspective
    - reforms
    - information
    - acceptance
    - trade
    - development
  min_weighted_overlap: 0.35
  head_term_synonyms:
    kiro:
      - kiro
      - amazon kiro
      - spec-driven
      - spec-driven development
      - specification-driven
      - ai coding assistant
      - coding assistant
      - ai assistant
      - copilot
    assistants:
      - ai assistant
      - coding assistant
      - ai agent
      - coding agent
      - copilot
  search_sources:
    - openalex
    - crossref
    - arxiv
    - semantic_scholar

# Handoff checks (DEC-016, docs/solution_design.md)
checks:
  check_a:
    min_on_topic_sources: 1
    floor_min_terms: 1
    # S11: below this many on-topic academic papers, the search is widened once (the same single retry).
    target_on_topic_papers:
      fast: 3
      deep: 5
  check_b:
    min_claims: 3
    min_sources: 2

# Provider per stage: "gemini" (free Google AI Studio) or "ollama" (free local model).
llm:
  map_provider: "ollama"
  reduce_provider: "ollama"
  allow_remote_synthesis: false

ollama:
  base_url: "http://localhost:11434"
  model: "qwen2.5:3b-instruct"
  num_ctx: 4096
  timeout_seconds: 180

gemini:
  model: "gemini-3.5-flash"

output:
  reports_dir: "outputs"
  json_dir: "outputs/json"
  csv_dir: "outputs/csv"
  markdown_filename: "research_report.md"
  json_filename: "research_report.json"
  csv_filename: "paper_index.csv"

logging:
  level: "INFO"
